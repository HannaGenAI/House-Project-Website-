<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>house. prjct — your favorite dayclub hotspot</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,600&display=swap" rel="stylesheet">
  
  <!-- Konfetti-Bibliothek -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    /* CSS VARIABLEN: DAY (STANDARD) */
    :root {
      --bg: #F5EFEB;
      --card-bg: #EFE8E2;
      --terracotta: #D04F34;
      --terracotta-hover: #B83E25;
      --sand: #DEC6B3;
      --brown: #3E1E14;
      --brown-light: #6E5349;
      --white: #FFFFFF;
      --border: rgba(62, 30, 20, 0.12);
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* CSS VARIABLEN: NIGHTCLUB MODE */
    body.night-mode {
      --bg: #141110;
      --card-bg: #1F1A17;
      --terracotta: #FF5A36;
      --terracotta-hover: #E04624;
      --sand: #3A2F2B;
      --brown: #F5EFEB;
      --brown-light: #B8A8A0;
      --white: #241E1B;
      --border: rgba(245, 239, 235, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background-color: var(--bg);
      color: var(--brown);
      font-family: var(--font-sans);
      line-height: 1.5;
      padding-top: 85px;
      overflow-x: hidden;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* HEADER */
    header {
      position: fixed;
      top: 0; left: 0; width: 100%;
      height: 85px;
      background: var(--bg);
      opacity: 0.96;
      backdrop-filter: blur(12px);
      z-index: 1000;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--terracotta);
    }

    .brand img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    nav {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: var(--brown);
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    nav a:hover { color: var(--terracotta); }

    /* VIBE MODE TOGGLE BUTTON */
    .btn-vibe {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--brown);
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-vibe:hover {
      border-color: var(--terracotta);
      transform: scale(1.04);
    }

    .btn-ticket {
      background: var(--terracotta);
      color: #FFFFFF;
      border: none;
      padding: 12px 24px;
      border-radius: 99px;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(208, 79, 52, 0.25);
      transition: all 0.2s ease;
    }

    .btn-ticket:hover {
      background: var(--terracotta-hover);
      transform: translateY(-1px);
    }

    /* HERO */
    .hero {
      padding: 60px 5% 70px;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 48px;
      align-items: center;
      max-width: 1400px;
      margin: 0 auto;
    }

    .hero-img-wrap {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      aspect-ratio: 16 / 10;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
    }

    .hero-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero-badge {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: var(--bg);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--terracotta);
      border: 1px solid var(--border);
    }

    .hero-text h1 {
      font-family: var(--font-serif);
      font-size: clamp(2.4rem, 4.2vw, 3.8rem);
      line-height: 1.12;
      color: var(--terracotta);
      margin-bottom: 20px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }

    .hero-sub {
      font-size: 1.25rem;
      color: var(--brown);
      margin-bottom: 24px;
    }

    /* COUNTDOWN BOX */
    .next-box {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      background: rgba(208, 79, 52, 0.12);
      border: 1px dashed var(--terracotta);
      border-radius: 99px;
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 30px;
      color: var(--brown);
    }

    #countdownTimer {
      color: var(--terracotta);
      letter-spacing: 0.5px;
      font-variant-numeric: tabular-nums;
    }

    .hero-actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn-secondary {
      padding: 12px 24px;
      border-radius: 99px;
      background: transparent;
      border: 1.5px solid var(--brown);
      color: var(--brown);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: var(--brown);
      color: var(--bg);
    }

    /* GENERAL SECTIONS */
    .section-wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 70px 5%;
    }

    .section-header {
      margin-bottom: 36px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .section-title {
      font-family: var(--font-serif);
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--brown);
    }

    /* BENTO & FACTS */
    .bento-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 24px;
    }

    .bento-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 32px;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    .bento-card.dark {
      background: var(--terracotta);
      color: #FFFFFF;
    }

    .bento-card.dark h3 {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      margin-bottom: 14px;
    }

    .bento-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 18px;
    }

    .fact-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }

    .fact-label { font-weight: 600; }

    /* SOUND PREVIEW PLAYER */
    .sound-preview-btn {
      background: var(--terracotta);
      color: #FFFFFF;
      border: none;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .sound-preview-btn:hover {
      background: var(--terracotta-hover);
      transform: scale(1.05);
    }

    /* Equalizer Waves Animation */
    .sound-waves {
      display: inline-flex;
      align-items: flex-end;
      gap: 3px;
      height: 12px;
    }

    .sound-waves span {
      width: 2.5px;
      height: 4px;
      background: #FFFFFF;
      border-radius: 2px;
      transition: height 0.2s ease;
    }

    .playing .sound-waves span:nth-child(1) { animation: soundWave 0.8s infinite ease-in-out; }
    .playing .sound-waves span:nth-child(2) { animation: soundWave 0.8s 0.2s infinite ease-in-out; }
    .playing .sound-waves span:nth-child(3) { animation: soundWave 0.8s 0.4s infinite ease-in-out; }

    @keyframes soundWave {
      0%, 100% { height: 4px; }
      50% { height: 12px; }
    }

    /* EVENTS */
    .events-filter {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
    }

    .filter-btn {
      padding: 8px 20px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--brown);
      font-weight: 600;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--terracotta);
      color: #FFFFFF;
      border-color: var(--terracotta);
    }

    .events-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 24px;
    }

    .event-card {
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: background 0.4s ease;
    }

      width: 100%;
      height: 200px;
      object-fit: cover
